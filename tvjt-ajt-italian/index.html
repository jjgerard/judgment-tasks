<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Ricerca sull'acquisizione del linguaggio</title>
<script src="https://unpkg.com/jspsych@8.3.0"></script>

<script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0"></script>

<link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet">
<style>
/* ---- Base text size: consent, language questions, transitions ---- */
.jspsych-display-element { font-size: clamp(20px, 3.4vw, 32px); line-height: 1.35; }
/* picture task uses slightly smaller text so picture + sentence + buttons fit a landscape phone */
.jspsych-display-element.picture-task { font-size: clamp(22px, min(3.8vw, 7.4vh), 34px); }   /* limited by screen height too */
.picture-task .jspsych-content { position: relative; }   /* so the logo sits below the progress bar, not over it */
@media (min-width: 1000px) {   /* desktop: big text (up to the original 64px) */
  .jspsych-display-element, .jspsych-display-element.picture-task { font-size: clamp(40px, 4vw, 64px); }
}

/* compact progress bar (the default one wastes a lot of height on a landscape phone) */
#jspsych-progressbar-container { font-size: 14px; padding: 4px 0; margin-bottom: 0.3em; }

/* ---- Accessibility: big tap targets, visible focus, text can always be pinch-zoomed ---- */
.jspsych-btn { font-size: 1em; min-height: 44px; padding: 0.35em 1.1em; }
.jspsych-display-element select { font-size: 1em; min-height: 44px; max-width: 100%; }
.jspsych-display-element img { max-width: 100%; height: auto; }
.jspsych-display-element :focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }

/* ---- Consent ---- */
.consent-page { max-width: 100%; margin: 0 auto; padding: 4px 8px; text-align: left; line-height: 1.3; }
.consent-page h1 { font-size: 1.2em; margin: 0.5em 0 0.2em; line-height: 1.2; }
.consent-page h1.consent-title > div { margin: 0.15em 0; }
.consent-page p { margin: 0.3em 0; }
.consent-page ul { margin: 0.2em 0 0.2em 1.2em; padding-left: 0; }
.consent-page li { margin: 0.2em 0; }
.consent-page img.crest { width: 22%; max-width: 300px; margin: 4px 0; }
.jspsych-display-element img.page-logo { position: fixed; top: var(--logo-top, 30px); right: 6px; z-index: 5; width: 20%; max-width: 350px; height: auto; max-height: 12vh; object-fit: contain; object-position: right top; }
.transition-logo { text-align: right; padding: 4px; }
.transition-logo img { width: 30%; max-width: 450px; }
.transition-text { padding: 4px 10px; font-size: 1.5em; line-height: 1.25; }
.transition-text p { margin: 0.3em 0; }

/* ---- Language questions: two columns to save height ---- */
.lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3em 1em; text-align: left; margin: 0.3em auto; padding: 0 0.6em; max-width: 100%; box-sizing: border-box; }
.lang-grid .lang-row { display: flex; align-items: center; gap: 0.4em; }
.lang-grid label { white-space: nowrap; }
@media (orientation: portrait) { .lang-grid { grid-template-columns: 1fr; } }   /* dropdowns stacked vertically on upright phones */
.lang-grid select { flex: 1 1 auto; min-width: 0; }
.jspsych-content p { margin: 0.3em 0; }

/* ---- Picture task ---- */
.intro-img { width: 45%; max-width: 400px; }
/* Koko sits directly above the sentence, so the sentence gets the full width (less wrapping) */
.koko-row { display: flex; flex-direction: column; align-items: center; gap: 0; margin: 0.1em 0 0.2em; text-align: center; }
.koko-row > div { line-height: 1.2; }
.jspsych-display-element img.intro-img { height: auto; max-height: 40vh; object-fit: contain; }
.jspsych-display-element img.story-img { display: block; width: 100%; height: 34vh; object-fit: contain; margin: 0 auto; }
.jspsych-display-element img.monkey-img { display: block; height: 12vh; width: auto; max-width: 30%; flex: none; margin: 0 auto; }

/* ---- Grammaticality-slider task ---- */
.jspsych-display-element.slider-task { font-size: 18px; line-height: 1.4; }
.slider-task .jspsych-content { width: 60%; max-width: 650px; margin-top: 0; font-size: 1.5em; line-height: 1.3; }
.slider-task div.directions { width: 100%; }
.slider-task div.directions p { margin: 0.35em 0; }
.slider-task div#jspsych-html-slider-response-wrapper { margin: 0.4em 0 2.6em !important; width: 100%; }
@media (max-width: 1200px) {
  .slider-task .jspsych-content { width: 100%; max-width: 100%; }
}
@media (max-height: 420px) {   /* short landscape phones: keep the Avanti button in view */
  .jspsych-display-element.slider-task { font-size: 15px; }
  .slider-task div#jspsych-html-slider-response-wrapper { margin: 0.2em 0 2.2em !important; }
}
@media (max-height: 340px) {
  .jspsych-display-element.slider-task { font-size: 12.5px; }
}

/* ---- Landscape prompt: shown on phones held upright ---- */
#rotate-prompt { display: none; position: fixed; inset: 0; z-index: 99999; background: #fff; color: #000;
  flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1em; }
#rotate-prompt p { font-size: 6.5vw; font-weight: bold; margin: 0.5em 0 0; line-height: 1.25; max-width: 90%; }
#rotate-prompt svg { width: 22vw; height: 22vw; }
/* only while the slider trials are running (class set by those trials, removed by every other screen) */
@media (orientation: portrait) and (max-width: 820px) and (pointer: coarse) { html.landscape-required #rotate-prompt { display: flex; } }
@media (prefers-reduced-motion: no-preference) {
  #rotate-prompt svg { animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
}
</style>
</head>
<body>
<div id="rotate-prompt" role="alert">
  <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="30" y="8" width="40" height="84" rx="7" fill="none" stroke="#000" stroke-width="5"/><circle cx="50" cy="84" r="3" fill="#000"/></svg>
  <p>Per favore, ruota il telefono in orizzontale per continuare.</p>
</div>
<script>

/* ------------------------------------------------------------------
   Combined experiment: picture true/false task + grammaticality-slider task
   Order of the two tasks is randomised per participant (counterbalanced).
   Language-background questions always come first (after consent).
   ------------------------------------------------------------------ */

// ---- Italian version: please confirm these two settings ----
const LOGO_SRC = 'media/coloring/logo_it.png';      // TODO: logo of the Italian partner institution
const REDIRECT_URL = 'https://www.ulster.ac.uk/';   // TODO: page participants are sent to after finishing

const timestamp = Date.now();
const experiment_version = 'italian_ac_combo';
const filename = timestamp + '_' + experiment_version;

const jsPsych = initJsPsych({
  show_progress_bar: true,
  auto_update_progress_bar: false,   // updated manually across both tasks
  message_progress_bar: 'Avanzamento',
  on_finish: function(){ saveData(filename, jsPsych.data.get().csv()); }
});

// random task order: ['picture','slider'] or ['slider','picture']
const task_order = jsPsych.randomization.shuffle(['picture', 'slider']);

jsPsych.data.addProperties({
  subject: timestamp,
  experiment: experiment_version,
  task_order: task_order.join('>')
});

// overall progress bar: 20 picture trials + slider trials (3 practice + test + fillers);
// the slider part is added once its items are built (see slider_block)
let total_trials = 20;
let trials_done = 0;
function advance(){
  trials_done++;
  jsPsych.progressBar.progress = Math.min(trials_done / total_trials, 1);
}

// landscape prompt is only needed for the slider judgment trials
function requireLandscape(){ document.documentElement.classList.add('landscape-required'); }

// switch between the two CSS looks
function setStyle(cls){
  return function(){
    const d = jsPsych.getDisplayContainerElement();
    d.classList.remove('slider-task', 'picture-task');
    document.documentElement.classList.remove('landscape-required');   // landscape only needed for the slider trials
    if(cls){ d.classList.add(cls); }
  };
}

// The logo is fixed to the top right of the screen, just below the progress bar
// (measured, so it never covers the bar whatever the bar's height or the page's scroll position).
function placeLogo(){
  const bar = document.getElementById('jspsych-progressbar-container');
  const bottom = bar ? bar.getBoundingClientRect().bottom : 0;
  document.documentElement.style.setProperty('--logo-top', Math.round(bottom + 4) + 'px');
}
window.addEventListener('resize', placeLogo);

const logo = '<img class="page-logo" src="' + LOGO_SRC + '" alt="Logo">';

/* ============================ CONSENT ============================ */

const consent1 = "<div>Ricerca sull'acquisizione del linguaggio presso [NOME DELL'UNIVERSITÀ ITALIANA]</div><div>Elaborazione delle frasi e meccanismi di memoria in bambini e adulti</div><div>Modulo di consenso informato del partecipante</div>";
const consent2 = "Grazie per aver accettato di partecipare a questo studio per la Scuola di Comunicazione e Media dell'Università dell'Ulster. Ti siamo molto grati per la tua partecipazione, che fornirà dati preziosi per lo studio scientifico del linguaggio.";
const consent3 = "Per favore, assicurati di usare uno smartphone in orientamento orizzontale.";
const consent4 = "Scopo dello studio";
const consent5 = "Questa ricerca è condotta da [NOMI DEI RICERCATORI] dell'[UNIVERSITÀ ITALIANA] e dalla Dott.ssa Juliana Gerard dell'Università dell'Ulster.";
const consent6 = "Ti invitiamo a partecipare a questo progetto di ricerca perché sei un adulto di madrelingua italiana.";
const consent7 = "Lo scopo di questo progetto di ricerca è comprendere meglio come gli esseri umani comprendono il linguaggio.";
const consent8 = "Questo studio è stato progettato anche per i bambini della scuola dell'infanzia, per comprendere lo sviluppo del linguaggio nei bambini.";
const consent9 = "Procedura";
const consent10 = "Lo studio durerà meno di 20 minuti.";
const consent11 = "Per prima cosa, risponderai a due domande sulla tua conoscenza delle lingue.";
const consent12 = "Poi svolgerai due brevi compiti.";
const consent13 = "In uno di essi, ti verrà chiesto di guardare una serie di disegni con personaggi di una serie televisiva per bambini e di rispondere a domande vero o falso sui disegni. Per favore, guarda i disegni e leggi la descrizione prima di rispondere a ogni domanda.";
const consent14 = "Nell'altro, ti verrà chiesto di leggere in silenzio frasi che possono contenere errori grammaticali e di valutarne la grammaticalità selezionando un punteggio su una scala scorrevole.";
const consent15 = "Tieni presente che alcune domande sono pensate per verificare la tua attenzione.";
const consent16 = "Il tuo consenso indica che:";
const consent17 = "Hai almeno 18 anni.";
const consent18 = "Scegli di partecipare a questo progetto di ricerca liberamente e volontariamente.";
const consent19 = "Comprendi che la tua partecipazione è volontaria e che sei libero/a di ritirarti dallo studio in qualsiasi momento.";
const consent20 = "Accetti che le ricercatrici registrino i dati di questa sessione, sapendo che questo materiale sarà salvato sul disco rigido della ricercatrice principale di questo progetto senza alcuna informazione personale identificativa e sarà utilizzato esclusivamente per gli obiettivi di questo progetto.";
const consent21 = "Se accetti di partecipare, fai clic su \"Avanti\" per continuare:";

const consent = {
  type: jsPsychInstructions,
  pages: [
    '<div class="consent-page">' +
      '<img class="crest" src="' + LOGO_SRC + '" alt="Logo">' +
      '<h1 class="consent-title">' + consent1 + '</h1>' +
      '<p>' + consent2 + '</p>' +
      '<p><b>' + consent3 + '</b></p>' +
      '<h1>' + consent4 + '</h1>' +
      '<ul>' +
        '<li>' + consent5 + '</li>' +
        '<li>' + consent6 + '</li>' +
        '<li>' + consent7 + '</li>' +
        '<li><b>' + consent8 + '</b></li>' +
      '</ul>' +
      '<h1>' + consent9 + '</h1>' +
      '<ul>' +
        '<li>' + consent10 + '</li>' +
        '<li>' + consent11 + '</li>' +
        '<li>' + consent12 + '</li>' +
        '<li>' + consent13 + '</li>' +
        '<li>' + consent14 + '</li>' +
        '<li><b>' + consent15 + '</b></li>' +
      '</ul>' +
      '<h1>' + consent16 + '</h1>' +
      '<ul>' +
        '<li>' + consent17 + '</li>' +
        '<li>' + consent18 + '</li>' +
        '<li>' + consent19 + '</li>' +
        '<li>' + consent20 + '</li>' +
      '</ul>' +
      '<p>' + consent21 + '</p>' +
    '</div>'
  ],
  button_label_next: 'Avanti',
  allow_backward: false,
  show_clickable_nav: true,
  on_start: setStyle(''),
  data: {trial_phase: 'consent'}
};

/* ===================== TRANSITION SCREENS ===================== */

function transitionScreen(text, phase){
  return {
    type: jsPsychInstructions,
    pages: [
      '<div class="transition-logo"><img src="' + LOGO_SRC + '" alt="Logo"></div>' +
      '<div class="transition-text"><p>' + text + '</p></div>'
    ],
    button_label_next: 'Avanti',
    allow_backward: false,
    show_clickable_nav: true,
    on_start: setStyle(''),
    data: {trial_phase: phase}
  };
}

const transition_language = transitionScreen('Ora ti chiederemo alcuni brevi dati sul tuo profilo linguistico', 'transition_language');
const transition_ready    = transitionScreen('Sei pronto/a per iniziare il compito successivo?', 'transition_ready');
const transition_between  = transitionScreen('Hai terminato la prima parte dello studio. Ora inizierà la seconda parte. Sei pronto/a?', 'transition_between');

/* ===================== LANGUAGE QUESTIONS ===================== */
/* Always presented first (after consent), whichever task comes first. */

const language_codes = ["it", "en", "es", "fr", "de", "pt", "ro", "ca", "af", "sq", "am", "ar", "hy", "az", "eu", "be", "bn", "bs", "bg", "my", "zh-Hans", "zh-Hant", "co", "hr", "cs", "da", "nl", "eo", "et", "fil", "fi", "fy", "gl", "ka", "el", "gu", "ht", "ha", "haw", "he", "hi", "hmn", "hu", "is", "ig", "id", "ga", "ja", "jv", "kn", "kk", "km", "rw", "ko", "ku", "ky", "lo", "la", "lv", "lt", "lb", "mk", "mg", "ms", "ml", "mt", "mi", "mr", "mn", "ne", "no", "or", "ps", "fa", "pl", "pa", "ru", "sm", "gd", "sr", "st", "sn", "sd", "si", "sk", "sl", "so", "su", "sw", "sv", "tg", "ta", "tt", "te", "th", "tr", "tk", "uk", "ur", "ug", "uz", "vi", "cy", "xh", "yi", "yo", "zu", "sc", "fur", "nap", "scn", "vec"];
const language_names = (function(){
  let dn = null;
  try { dn = new Intl.DisplayNames(['it'], {type: 'language'}); } catch(e) {}
  const cap = function(s){ return s.charAt(0).toUpperCase() + s.slice(1); };
  const names = [];
  language_codes.forEach(function(c){
    let n = dn ? dn.of(c) : c;
    if(!n || n === c){ return; }
    n = cap(n);
    if(names.indexOf(n) < 0){ names.push(n); }
  });
  if(names.length === 0){ return language_codes.concat(['Dialetto', 'Altra lingua']); }
  const first = names.slice(0, 2);   // Italiano, Inglese
  const rest = names.slice(2).sort(function(a, b){ return a.localeCompare(b, 'it'); });
  return first.concat(rest, ['Dialetto', 'Altra lingua']);
})();


// Browser validation messages for required <select> fields, in Italian
function spanishValidation(){
  document.querySelectorAll('select[required]').forEach(function(sel){
    sel.addEventListener('invalid', function(){ sel.setCustomValidity('Seleziona un\'opzione dall\'elenco.'); });
    sel.addEventListener('change',  function(){ sel.setCustomValidity(''); });
  });
}

let reported_languages = [];   // filled after the first language question

const language_options = '<option value=""></option>' +
  language_names.map(function(l){ return '<option value="' + l + '">' + l + '</option>'; }).join('');

const leap_survey1 = {
  type: jsPsychSurveyHtmlForm,
  preamble: '<p>Per favore, indica tutte le lingue che parli <b>in ordine di dominanza</b>:</p>',
  html: function(){
    let h = '<div class="lang-grid">';
    for(let i = 1; i <= 5; i++){
      h += '<div class="lang-row"><label for="language' + i + '">' + i + '</label>' +
           '<select id="language' + i + '" name="language' + i + '"' + (i === 1 ? ' required' : '') + '>' +
           language_options + '</select></div>';
    }
    return h + '</div>';
  },
  button_label: 'Avanti',
  on_start: setStyle(''),
  on_load: spanishValidation,
  data: {trial_phase: 'languages'},
  on_finish: function(data){
    reported_languages = [];
    for(let i = 1; i <= 5; i++){
      const l = (data.response['language' + i] || '').trim();
      if(l.length > 0){ reported_languages.push(l); }
    }
    data.languages = reported_languages.join('|');
  }
};

const leap_survey2 = {
  type: jsPsychSurveyHtmlForm,
  preamble: '<p>Per favore, indica il tuo <b>livello di competenza linguistica</b> in ciascuna delle lingue indicate di seguito:</p>',
  html: function(){
    const fluencies = '<option value=""></option><option value="Madrelingua">Madrelingua</option><option value="Avanzato">Avanzato</option><option value="Intermedio">Intermedio</option><option value="Principiante">Principiante</option>';
    let h = '';
    reported_languages.forEach(function(language, i){
      h += '<div class="lang-row"><label for="fluency' + (i + 1) + '">' + language + ':</label>' +
           '<select id="fluency' + (i + 1) + '" name="fluency' + (i + 1) + '" required>' + fluencies + '</select></div>';
    });
    return '<div class="lang-grid">' + h + '</div>';
  },
  button_label: 'Avanti',
  on_load: spanishValidation,
  data: {trial_phase: 'languages_fluency'},
  on_finish: function(data){ data.languages = reported_languages.join('|'); }
};

/* ============================================================
   TASK 1: PICTURE TRUE/FALSE TASK (from ac_spa1)
   ============================================================ */

const picture_block = (function(){

  let s2 = "Joey ha colorato alcuni disegni di Dora, Diego e Topolino.";
  let s3 = "Questo è Koko, l'amico di Joey.<br>Koko ci dirà cosa c'è nei disegni, ma a volte Koko sbaglia il colore.";
  let s4 = "Per favore, guarda i disegni e le loro descrizioni. <br><br>Dopo ogni descrizione, Koko dirà una frase sui colori del disegno.";
  let s5 = "<b>Per favore, rispondi se la frase è vera o falsa.</b><br>Dovresti rispondere in fretta, in base alla tua prima impressione (senza pensarci troppo).";
  let test_pngs = ["wash_eat_mickey", "fan_hug_mickey", "paint_pick_mickey", "tag_read_mickey", "brush_pet_mickey", "dry_bake_mickey", "lift_catch_mickey", "splash_fly_mickey"];

  let training_descriptions = ["In questo disegno, abbiamo Dora con dell'uva e Diego con una fragola.", "Riprova, Koko: In questo disegno, abbiamo Dora con dell'uva e Diego con una fragola.", "In questo disegno, Dora e Topolino si stanno provando dei vestiti<br>e poi Dora ha un cappello e anche Topolino ha un cappello.", "In questo disegno, Diego e Topolino hanno un pastello a cera e un pennello<br>e poi Diego ha un secchiello e anche Topolino ha un secchiello."];
  let test_descriptions = ["In questo disegno, Topolino sta lavando Diego<br>e poi Topolino sta mangiando una mela e anche Diego sta mangiando una mela.", "In questo disegno, Topolino sta facendo vento a Diego<br>e poi Diego sta abbracciando un orso e anche Topolino sta abbracciando un orso.", "In questo disegno, Topolino sta dipingendo Diego<br>e poi Topolino sta cogliendo un fiore e anche Diego sta cogliendo un fiore.", "In questo disegno, Topolino sta acchiappando Diego<br>e poi Topolino sta leggendo un libro e anche Diego sta leggendo un libro.", "In questo disegno, Diego sta spazzolando Topolino<br>e poi Topolino sta accarezzando un cane e anche Diego sta accarezzando un cane.", "In questo disegno, Diego sta asciugando Topolino<br>e poi Diego sta preparando una torta e anche Topolino sta preparando una torta.", "In questo disegno, Diego sta sollevando Topolino<br>e poi Diego sta pescando un pesce e anche Topolino sta pescando un pesce.", "In questo disegno, Diego sta schizzando Topolino<br>e poi Topolino sta facendo volare un aquilone e anche Diego sta facendo volare un aquilone."];
  let control_descriptions = ["In questo disegno, Dora sta seppellendo Topolino<br>e poi Dora sta dando un calcio a un pallone e anche Topolino sta dando un calcio a un pallone.", "In questo disegno, Dora sta dando un colpetto a Diego<br>e poi Diego sta dipingendo un leone e anche Dora sta dipingendo un leone.", "In questo disegno, Dora sta abbracciando Diego<br>e poi Diego sta aprendo una scatola e anche Dora sta aprendo una scatola.", "In questo disegno, Dora sta strofinando Topolino<br>e poi Dora sta costruendo una torre e anche Topolino sta costruendo una torre.", "In questo disegno, Topolino sta pettinando Dora<br>e poi Topolino sta suonando una campana e anche Dora sta suonando una campana.", "In questo disegno, Diego sta dando da mangiare a Dora<br>e poi Diego sta andando in bici e anche Dora sta andando in bici.", "In questo disegno, Topolino sta toccando Dora con il dito<br>e poi Topolino sta lanciando una palla e anche Dora sta lanciando una palla.", "In questo disegno, Diego sta spingendo Dora<br>e poi Diego sta guidando una macchina e anche Dora sta guidando una macchina."];
  let training_sentences = ["Dora ha dell'uva gialla!\"", "Diego ha una fragola gialla!\"", "Dora si è provata una sciarpa prima che Topolino comprasse il cappello verde\"", "Topolino ha preso un pennello prima che Diego disegnasse il secchiello rosso\""];

function shuffle(array) {
  let currentIndex = array.length;

  // While there remain elements to shuffle...
  while (currentIndex != 0) {

    // Pick a remaining element...
    let randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;

    // And swap it with the current element.
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
}

    stimulus: function(){ return jsPsych.evaluateTimelineVariable('sentence') + '.'; },
    prompt: '<p style="margin:0.3em 0;">Quanto è grammaticale questa frase? Usa il cursore qui sopra.</p>',
    labels: ['Scorretta (Agrammaticale)', 'Corretta (Grammaticale)'],
    // jsPsych draws each end label in a box as wide as the slider, centred on the slider's end,
    // so the slider must be at most ~half the screen width or the page overflows and phones zoom out.
    slider_width: function(){ return Math.max(160, Math.min(500, Math.floor(window.innerWidth * 0.45))); },
    require_movement: true,
    button_label: 'Avanti',
    on_start: requireLandscape,
    post_trial_gap: 500,
    data: {
      trial_phase: 'slider_sentence',
      sentence: jsPsych.timelineVariable('sentence'),
      condition: jsPsych.timelineVariable('condition'),
      grammaticality: jsPsych.timelineVariable('grammaticality'),
      item: jsPsych.timelineVariable('item')
    },
    on_finish: advance
  };

  // Practice sentences: the answer must be on the right side of the midline (50).
  //   grammatical sentence ('Yes')   -> rating must not be below 50
  //   ungrammatical sentence ('No')  -> rating must not be above 50
  // If it is on the wrong side, the "Avanti" click is blocked and a red message is shown
  // on the same screen; the participant can adjust the slider and try again.
  const practice_trial = function(item){
    return Object.assign({}, sentence2, {
      stimulus: item.sentence + '.',
      data: {trial_phase: 'slider_practice', sentence: item.sentence, condition: item.condition,
             grammaticality: item.grammaticality, item: item.item},
      on_load: function(){
        const container = jsPsych.getDisplayElement();
        const slider = container.querySelector('#jspsych-html-slider-response-response');
        const button = container.querySelector('#jspsych-html-slider-response-next');

        // red message, space reserved so the layout does not jump
        const msg = document.createElement('p');
        msg.textContent = 'Sei sicuro/a della tua risposta?';
        msg.setAttribute('role', 'alert');
        msg.style.cssText = 'color:red; font-weight:bold; visibility:hidden; margin:0.3em 0;';
        button.parentNode.insertBefore(msg, button);

        const is_wrong = function(){
          const v = Number(slider.value);
          return (item.grammaticality === 'Yes') ? (v < 50) : (v > 50);
        };
        // capture phase on the container: runs before the plugin's own click handler
        container.addEventListener('click', function(e){
          if(e.target === button && is_wrong()){
            e.stopPropagation();
            msg.style.visibility = 'visible';
          }
        }, true);
        slider.addEventListener('input', function(){ msg.style.visibility = 'hidden'; });
      }
    });
  };

  const practice1 = {
    timeline: practice_items.map(practice_trial),
    randomize_order: false
  };

  // Shuffle the 32 test items and the 20 fillers separately, then spread the fillers
  // evenly through the trials. All test items and all fillers are shown.
  const tests = jsPsych.randomization.shuffle(trial_items.filter(function(t){ return t.condition !== 'filler'; }));
  const fills = jsPsych.randomization.shuffle(trial_items.filter(function(t){ return t.condition === 'filler'; }));
  const n_all = tests.length + fills.length;
  const ordered_items = [];
  let ti = 0, fi = 0;
  for(let k = 0; k < n_all; k++){
    const filler_due = Math.floor((k + 1) * fills.length / n_all) > Math.floor(k * fills.length / n_all);
    ordered_items.push(filler_due ? fills[fi++] : tests[ti++]);
  }

  total_trials += practice_items.length + ordered_items.length;

  const procedure = {
    timeline: [sentence2],
    timeline_variables: ordered_items,
    randomize_order: false
  };

  return {timeline: [instructions, practice1, instructions2, procedure], data: {task: 'slider'}};
})();

/* ============================ END ============================ */

const final = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<p>Grazie per la tua partecipazione!</p> <p>Fai clic su \"Invia\" per registrare le tue risposte:</p>',
  choices: ['Invia'],
  on_start: setStyle(''),
  data: {trial_phase: 'final'}
};

function saveData(name, data){
  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'write_data.php');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.send(JSON.stringify({filename: name, filedata: data}));
  xhr.onload = function(){
    window.location = REDIRECT_URL; // where participants go after finishing
  };
}

/* ======================= FULL TIMELINE ======================= */

const blocks = {picture: picture_block, slider: slider_block};

jsPsych.run([
  consent,
  transition_language,
  leap_survey1,
  leap_survey2,
  transition_ready,
  blocks[task_order[0]],
  transition_between,
  blocks[task_order[1]],
  final
]);

</script>
