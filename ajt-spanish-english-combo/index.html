<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigación sobre lenguaje en la Universidad Nacional de Educación a Distancia</title>
<script src="https://unpkg.com/jspsych@8.3.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
<link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet">
<style>
/* ---- Base text size: consent, language questions, transitions ---- */
.jspsych-display-element { font-size: clamp(20px, 3.4vw, 32px); line-height: 1.35; }
/* picture task uses slightly smaller text so picture + sentence + buttons fit a landscape phone */
.jspsych-display-element.picture-task { font-size: clamp(22px, min(3.8vw, 7.4vh), 34px); }   /* limited by screen height too */
.picture-task .jspsych-content { position: relative; }   /* so the logo sits below the progress bar, not over it */
@media (min-width: 1000px) {   /* desktop: big text (up to the original 64px) */
  .jspsych-display-element, .jspsych-display-element.picture-task { font-size: clamp(40px, 4vw, 64px); }
}

/* compact progress bar (the default one wastes a lot of height on a landscape phone) */
#jspsych-progressbar-container { font-size: 14px; padding: 4px 0; margin-bottom: 0.3em; }

/* ---- Accessibility: big tap targets, visible focus, text can always be pinch-zoomed ---- */
.jspsych-btn { font-size: 1em; min-height: 44px; padding: 0.35em 1.1em; }
.jspsych-display-element select { font-size: 1em; min-height: 44px; max-width: 100%; }
.jspsych-display-element img { max-width: 100%; height: auto; }
.jspsych-display-element :focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }

/* ---- Consent ---- */
.consent-page { max-width: 100%; margin: 0 auto; padding: 4px 8px; text-align: left; line-height: 1.3; }
.consent-page h1 { font-size: 1.2em; margin: 0.5em 0 0.2em; line-height: 1.2; }
.consent-page h1.consent-title > div { margin: 0.15em 0; }
.consent-page p { margin: 0.3em 0; }
.consent-page ul { margin: 0.2em 0 0.2em 1.2em; padding-left: 0; }
.consent-page li { margin: 0.2em 0; }
.consent-page img.crest { width: 22%; max-width: 300px; margin: 4px 0; }
.jspsych-display-element img.page-logo { position: fixed; top: var(--logo-top, 30px); right: 6px; z-index: 5; width: 20%; max-width: 350px; height: auto; max-height: 12vh; object-fit: contain; object-position: right top; }
.transition-logo { text-align: right; padding: 4px; }
.transition-logo img { width: 30%; max-width: 450px; }
.transition-text { padding: 4px 10px; font-size: 1.5em; line-height: 1.25; }
.transition-text p { margin: 0.3em 0; }

/* ---- Language questions: two columns to save height ---- */
.lang-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.3em 1em; text-align: left; margin: 0.3em auto; padding: 0 0.6em; max-width: 100%; box-sizing: border-box; }
.lang-grid .lang-row { display: flex; align-items: center; gap: 0.4em; }
.lang-grid label { white-space: nowrap; }
/* proficiency question: language name above its dropdown, so the longer level names (e.g. "Principiante (A1-A2)") fit */
.lang-grid .lang-row.stacked { flex-direction: column; align-items: stretch; gap: 0.1em; }
.lang-grid .lang-row.stacked select { width: 100%; }
@media (orientation: portrait) { .lang-grid { grid-template-columns: 1fr; } }   /* dropdowns stacked vertically on upright phones */
.lang-grid select { flex: 1 1 auto; min-width: 0; }
.jspsych-content p { margin: 0.3em 0; }

/* ---- Reduced LEAP-Q (combo) ---- */
.leap-demo { display: flex; flex-direction: column; gap: 0.5em; align-items: center; margin: 0.3em 0; text-align: left; }
.leap-demo .lang-row { display: flex; align-items: center; gap: 0.9em; flex-wrap: wrap; justify-content: center; }
.leap-demo label { display: inline-flex; align-items: center; gap: 0.35em; min-height: 44px; }
.leap-demo input[type=radio] { width: 1.1em; height: 1.1em; }
.leap-langs { display: flex; flex-direction: column; gap: 0.3em; margin: 0.3em auto; padding: 0 0.6em; box-sizing: border-box; max-width: 100%; }
.leap-row { display: grid; grid-template-columns: 1.2em minmax(0, 1fr) minmax(0, 1fr); gap: 0.4em; align-items: center; text-align: left; }
.leap-row select { width: 100%; min-width: 0; }
@media (orientation: portrait) { .leap-row { grid-template-columns: 1.2em minmax(0, 1fr); } .leap-row .leap-num { grid-row: span 2; } }

/* ---- Picture task ---- */
.intro-img { width: 45%; max-width: 400px; }
/* Koko sits directly above the sentence, so the sentence gets the full width (less wrapping) */
.koko-row { display: flex; flex-direction: column; align-items: center; gap: 0; margin: 0.1em 0 0.2em; text-align: center; }
.koko-row > div { line-height: 1.2; }
.jspsych-display-element img.intro-img { height: auto; max-height: 40vh; object-fit: contain; }
.jspsych-display-element img.story-img { display: block; width: 100%; height: 34vh; object-fit: contain; margin: 0 auto; }
.jspsych-display-element img.monkey-img { display: block; height: 12vh; width: auto; max-width: 30%; flex: none; margin: 0 auto; }

/* ---- Grammaticality-slider task ---- */
.jspsych-display-element.slider-task { font-size: 18px; line-height: 1.4; }
.slider-task .jspsych-content { width: 60%; max-width: 650px; margin-top: 0; font-size: 1.5em; line-height: 1.3; }
.slider-task div.directions { width: 100%; }
.slider-task div.directions p { margin: 0.35em 0; }
.slider-task div#jspsych-html-slider-response-wrapper { margin: 0.4em 0 2.6em !important; width: 100%; }
@media (max-width: 1200px) {
  .slider-task .jspsych-content { width: 100%; max-width: 100%; }
}
@media (max-height: 420px) {   /* short landscape phones: keep the Siguiente button in view */
  .jspsych-display-element.slider-task { font-size: 15px; }
  .slider-task div#jspsych-html-slider-response-wrapper { margin: 0.2em 0 2.2em !important; }
}
@media (max-height: 340px) {
  .jspsych-display-element.slider-task { font-size: 12.5px; }
}

/* ---- Landscape prompt: shown on phones held upright ---- */
#rotate-prompt { display: none; position: fixed; inset: 0; z-index: 99999; background: #fff; color: #000;
  flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1em; }
#rotate-prompt p { font-size: 6.5vw; font-weight: bold; margin: 0.5em 0 0; line-height: 1.25; max-width: 90%; }
#rotate-prompt svg { width: 22vw; height: 22vw; }
/* only while the slider trials are running (class set by those trials, removed by every other screen) */
@media (orientation: portrait) and (max-width: 820px) and (pointer: coarse) { html.landscape-required #rotate-prompt { display: flex; } }
@media (prefers-reduced-motion: no-preference) {
  #rotate-prompt svg { animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
}
</style>
</head>
<body>
<div id="rotate-prompt" role="alert">
  <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="30" y="8" width="40" height="84" rx="7" fill="none" stroke="#000" stroke-width="5"/><circle cx="50" cy="84" r="3" fill="#000"/></svg>
  <p>Por favor, gira tu teléfono a orientación horizontal para continuar.</p>
</div>
<script>

/* ------------------------------------------------------------------
   Combined experiment: Spanish + English grammaticality-judgement (slider) tasks,
   back to back. The order of the two tasks is randomised per participant
   (counterbalanced). The language-background questions always come first.
   ------------------------------------------------------------------ */

const timestamp = Date.now();
const experiment_version = 'spanish_english_gj_combo';
const filename = timestamp + '_' + experiment_version;

const jsPsych = initJsPsych({
  show_progress_bar: true,
  auto_update_progress_bar: false,   // updated manually across both tasks
  message_progress_bar: 'Progreso',
  on_finish: function(){ saveData(filename, jsPsych.data.get().csv()); }
});

// random task order: ['es','en'] (Spanish first) or ['en','es'] (English first)
const task_order = jsPsych.randomization.shuffle(['es', 'en']);
const language_name = {es: 'español', en: 'inglés'};

jsPsych.data.addProperties({
  subject: timestamp,
  experiment: experiment_version,
  task_order: task_order.join('>')
});

// overall progress bar over both tasks; each task adds its own trials when it is built
let total_trials = 0;
let trials_done = 0;
function advance(){
  trials_done++;
  jsPsych.progressBar.progress = Math.min(trials_done / total_trials, 1);
}

// landscape prompt is only needed for the slider judgment trials
function requireLandscape(){ document.documentElement.classList.add('landscape-required'); }

// switch between CSS looks
function setStyle(cls){
  return function(){
    const d = jsPsych.getDisplayContainerElement();
    d.classList.remove('slider-task', 'picture-task');
    document.documentElement.classList.remove('landscape-required');   // landscape only needed for the slider trials
    if(cls){ d.classList.add(cls); }
  };
}

// The logo is fixed to the top right of the screen, just below the progress bar
// (measured, so it never covers the bar whatever the bar's height or the page's scroll position).
function placeLogo(){
  const bar = document.getElementById('jspsych-progressbar-container');
  const bottom = bar ? bar.getBoundingClientRect().bottom : 0;
  document.documentElement.style.setProperty('--logo-top', Math.round(bottom + 4) + 'px');
}
window.addEventListener('resize', placeLogo);

const logo = '<img class="page-logo" src="media/coloring/uned.png" alt="UNED">';

/* ============================ CONSENT ============================ */

const consent1 = "<div>Investigación sobre lenguaje en la Universidad Nacional de Educación a Distancia</div><div>Comprensión, producción y procesamiento de oraciones</div><div>Formulario de consentimiento informado del participante</div>";
const consent2 = "Gracias por participar en este estudio para la Escuela de Comunicación y Medios de la Universidad de Ulster. Te agradecemos mucho tu participación, ya que proporcionará datos valiosos para el estudio científico del lenguaje.";
const consent3 = "Por favor, asegúrate de utilizar tu teléfono móvil en orientación horizontal.";
const consent4 = "Objetivo del estudio";
const consent5 = "Esta investigación la lleva a cabo la Dra. Silvia Sánchez Calderón y la Dra. Gloria Chamorro Galán de la Universidad Nacional de Educación a Distancia y la Dra. Juliana Gerard de la Universidad de Ulster.";
const consent6 = "Te invitamos a participar en este proyecto de investigación porque cumples con el perfil de participantes que buscamos: personas adultas cuya lengua materna es el español y que han aprendido/están aprendiendo inglés como lengua extranjera.";
const consent7 = "";
const consent8 = "";
const consent9 = "Procedimiento";
const consent10 = "El estudio durará hasta 20 minutos.";
const consent11 = "Primero, responderás a dos preguntas sobre tu conocimiento de idiomas.";
const consent12 = "Después, realizarás dos tareas breves: una con oraciones en español y otra con oraciones en inglés. Su orden puede variar.";
const consent13 = "";
const consent14 = "En cada una de ellas, se te pedirá que leas en silencio oraciones que pueden contener errores gramaticales.";
const consent14b = "A continuación, tendrás que indicar cómo de natural te suena cada oración utilizando la escala deslizante.";
const consent15 = "Ten en cuenta que algunas preguntas están diseñadas para comprobar tu atención.";
const consent15b = "Al terminar, podrás participar de forma voluntaria en el sorteo de 2 cupones (30 € cada uno) escribiendo tu correo electrónico en la última pantalla. Tu correo se guardará por separado de tus respuestas, sin relacionarlo con ellas, y se utilizará únicamente para el sorteo.";
const consent16 = "Tu consentimiento indica que:";
const consent17 = "";
const consent18 = "Eliges libre y voluntariamente participar en este proyecto de investigación.";
const consent19 = "Comprendes que tu participación es voluntaria y que puedes retirar tus datos del estudio en cualquier momento.";
const consent20 = "Estás de acuerdo en que los investigadores registren los datos de esta sesión, sabiendo que se guardarán de forma segura por la investigadora principal (Dra. Juliana Gerard) en un ordenador de la Universidad de Ulster, sin incluir información que permita identificarte personalmente, y que se utilizará exclusivamente con fines de investigación.";
const consent21 = "Si aceptas participar, haz clic en «Siguiente» para continuar:";

// list item, only shown when the text is not empty (a consent line can be switched off by setting it to '')
const li = function(t, bold){ return t ? '<li>' + (bold ? '<b>' + t + '</b>' : t) + '</li>' : ''; };

const consent = {
  type: jsPsychInstructions,
  pages: [
    '<div class="consent-page">' +
      '<img class="crest" src="media/coloring/uned.png" alt="UNED">' +
      '<h1 class="consent-title">' + consent1 + '</h1>' +
      '<p>' + consent2 + '</p>' +
      '<p><b>' + consent3 + '</b></p>' +
      '<h1>' + consent4 + '</h1>' +
      '<ul>' + li(consent5) + li(consent6) + li(consent7) + li(consent8, true) + '</ul>' +
      '<h1>' + consent9 + '</h1>' +
      '<ul>' + li(consent10) + li(consent11) + li(consent12) + li(consent13) + li(consent14) + li(consent14b) + li(consent15, true) + li(consent15b) + '</ul>' +
      '<h1>' + consent16 + '</h1>' +
      '<ul>' + li(consent17) + li(consent18) + li(consent19) + li(consent20) + '</ul>' +
      '<p>' + consent21 + '</p>' +
    '</div>'
  ],
  button_label_next: 'Siguiente',
  allow_backward: false,
  show_clickable_nav: true,
  on_start: setStyle(''),
  data: {trial_phase: 'consent'}
};

/* ===================== TRANSITION SCREENS ===================== */

function transitionScreen(text, phase){
  return {
    type: jsPsychInstructions,
    pages: [
      '<div class="transition-logo"><img src="media/coloring/uned.png" alt="UNED"></div>' +
      '<div class="transition-text"><p>' + text + '</p></div>'
    ],
    button_label_next: 'Siguiente',
    allow_backward: false,
    show_clickable_nav: true,
    on_start: setStyle(''),
    data: {trial_phase: phase}
  };
}

const transition_language = transitionScreen('Ahora, te pediremos unos breves datos sobre tu perfil lingüístico', 'transition_language');
const transition_ready    = transitionScreen('¿Estás preparado/a para iniciar la primera tarea? Las oraciones estarán en ' + language_name[task_order[0]] + '.', 'transition_ready');
const transition_between  = transitionScreen('Has terminado la primera parte del estudio. Ahora comenzará la segunda parte: las oraciones estarán en ' + language_name[task_order[1]] + '. ¿Estás preparado/a?', 'transition_between');

/* ===================== LANGUAGE QUESTIONS ===================== */
/* Always presented first (after consent), whichever task comes first. */

const language_names = ["Español", "Inglés", "Afrikáans", "Alemán", "Amhárico", "Árabe", "Armenio", "Azerbaiyano", "Bengalí", "Bielorruso", "Birmano", "Bosnio", "Búlgaro", "Canarés", "Catalán", "Checo", "Chichewa", "Chino (Simplificado)", "Chino (Tradicional)", "Cingalés", "Coreano", "Corso", "Criollo haitiano", "Croata", "Danés", "Eslovaco", "Esloveno", "Esperanto", "Estonio", "Euskera", "Filipino", "Finés", "Francés", "Frisio", "Galés", "Gallego", "Gaélico escocés", "Georgiano", "Griego", "Guyaratí", "Hausa", "Hawaiano", "Hebreo", "Hindi", "Hmong", "Holandés", "Húngaro", "Igbo", "Indonesio", "Irlandés", "Islandés", "Italiano", "Japonés", "Javanés", "Kazajo", "Kirguís", "Kinyarwanda", "Kurdo (Kurmanji)", "Lao", "Latín", "Letón", "Lituano", "Luxemburgués", "Macedonio", "Malgache", "Malayo", "Malayalam", "Maltés", "Maorí", "Maratí", "Mongol", "Nepalí", "Noruego", "Odia (Oriya)", "Pastú", "Persa", "Polaco", "Portugués", "Punyabí", "Rumano", "Ruso", "Samoano", "Serbio", "Sesotho", "Shona", "Sindhi", "Somalí", "Sueco", "Suajili", "Sundanés", "Tátaro", "Tailandés", "Tamil", "Tayiko", "Telugu", "Turco", "Turcomano", "Ucraniano", "Uigur", "Urdu", "Uzbeko", "Vietnamita", "Xhosa", "Yídish", "Yoruba", "Zulú"];


// Spanish text for the browser's own form-validation messages
function spanishValidation(){
  const container = jsPsych.getDisplayElement();
  container.querySelectorAll('input, select').forEach(function(el){
    el.addEventListener('invalid', function(){
      const v = el.validity;
      if(v.customError){ return; }   // keep a message that is already set (e.g. language listed twice)
      let msg = 'Por favor, completa este campo.';
      if(el.tagName === 'SELECT'){ msg = 'Por favor, selecciona una opción de la lista.'; }
      else if(el.type === 'radio'){ msg = 'Por favor, selecciona una opción.'; }
      else if(el.type === 'email'){ msg = 'Por favor, escribe un correo electrónico válido o deja el campo vacío.'; }
      else if(el.type === 'number'){
        msg = (v.valueMissing) ? 'Por favor, escribe tu edad.' : 'Por favor, escribe una edad válida (en años).';
      }
      el.setCustomValidity(msg);
    });
    const clear = function(){ el.setCustomValidity(''); };
    el.addEventListener('input', clear);
    el.addEventListener('change', clear);
    if(el.type === 'radio'){
      // choosing any option of a radio group clears the message on every button of the group
      el.addEventListener('change', function(){
        container.querySelectorAll('input[type=radio]').forEach(function(r){ if(r.name === el.name){ r.setCustomValidity(''); } });
      });
    }
  });
}

/* =============== REDUCED LEAP-Q (first page only, items highlighted by the lab) ===============
   Screen 1: age + sex.  Screen 2: languages in order of acquisition (first language first),
   each with a self-rated proficiency level. */

const language_options = '<option value="">Lengua</option>' +
  language_names.map(function(l){ return '<option value="' + l + '">' + l + '</option>'; }).join('');

const level_options = '<option value="">Nivel</option>' +
  '<option value="Principiante (A1-A2)">Principiante (A1-A2)</option>' +
  '<option value="Intermedio (B1-B2)">Intermedio (B1-B2)</option>' +
  '<option value="Avanzado (C1-C2)">Avanzado (C1-C2)</option>' +
  '<option value="Nativo">Nativo</option>';

const leap_demo = {
  type: jsPsychSurveyHtmlForm,
  preamble: '<p>Por favor, indica tu edad y tu sexo:</p>',
  html: '<div class="leap-demo">' +
          '<div class="lang-row"><label for="age">Edad</label>' +
            '<input type="number" id="age" name="age" inputmode="numeric" min="1" max="120" step="1" required style="width:5em; font-size:1em; min-height:44px;"></div>' +
          '<div class="lang-row" role="radiogroup" aria-label="Sexo">' +
            '<label><input type="radio" name="sex" value="Hombre" required> Hombre</label>' +
            '<label><input type="radio" name="sex" value="Mujer" required> Mujer</label>' +
          '</div>' +
        '</div>',
  button_label: 'Siguiente',
  on_start: setStyle(''),
  on_load: spanishValidation,
  data: {trial_phase: 'leap_demographics'}
};

const leap_languages = {
  type: jsPsychSurveyHtmlForm,
  preamble: '<p>Por favor, indica todas las lenguas que hablas <b>en orden de adquisición</b> (tu lengua materna primero) y tu <b>nivel de competencia lingüística</b> en cada una (principiante A1-A2, intermedio B1-B2, avanzado C1-C2 o nativo):</p>',
  html: function(){
    let h = '<div class="leap-langs">';
    for(let i = 1; i <= 5; i++){
      h += '<div class="leap-row">' +
             '<span class="leap-num" aria-hidden="true">' + i + '</span>' +
             '<select id="language' + i + '" name="language' + i + '" aria-label="Lengua ' + i + '"' + (i === 1 ? ' required' : '') + '>' + language_options + '</select>' +
             '<select id="level' + i + '" name="level' + i + '" aria-label="Nivel de la lengua ' + i + '"' + (i === 1 ? ' required' : '') + '>' + level_options + '</select>' +
           '</div>';
    }
    return h + '</div>';
  },
  button_label: 'Siguiente',
  on_load: function(){
    spanishValidation();
    const c = jsPsych.getDisplayElement();
    const lang = function(i){ return c.querySelector('#language' + i); };
    const lev = function(i){ return c.querySelector('#level' + i); };
    // a level is needed for every language listed (and a language for every level chosen); no language twice
    const refresh = function(){
      for(let i = 1; i <= 5; i++){
        const filled = lang(i).value !== '' || lev(i).value !== '';
        lang(i).required = (i === 1) || filled;
        lev(i).required = (i === 1) || filled;
        let dup = false;
        for(let j = 1; j < i; j++){ if(lang(i).value !== '' && lang(i).value === lang(j).value){ dup = true; } }
        lang(i).setCustomValidity(dup ? 'Esta lengua ya está en la lista.' : '');
      }
    };
    for(let i = 1; i <= 5; i++){
      lang(i).addEventListener('change', refresh);
      lev(i).addEventListener('change', refresh);
      // keep the duplicate message from being cleared by the generic handler
      lang(i).addEventListener('input', refresh);
    }
    refresh();
  },
  data: {trial_phase: 'leap_languages'},
  on_finish: function(data){
    const langs = [], levels = [];
    for(let i = 1; i <= 5; i++){
      const l = (data.response['language' + i] || '').trim();
      if(l.length > 0){ langs.push(l); levels.push(data.response['level' + i] || ''); }
    }
    data.languages = langs.join('|');     // in order of acquisition, first language first
    data.levels = levels.join('|');
  }
};

/* ============================================================
   GRAMMATICALITY-SLIDER TASK, built once per language (Spanish and English)
   ============================================================ */

const test_sentences = {
  1: {
    s_m_match_gram: "El chico lavó a la chica antes de ponerse melancólico",
    s_m_mismatch_gram: "El chico lavó a las chicas antes de ponerse melancólico",
    s_f_match_gram: "La chica lavó al chico antes de ponerse melancólica",
    s_f_mismatch_gram: "La chica lavó a los chicos antes de ponerse melancólica",
    s_m_match_ungram: "El chico lavó a la chica antes de ponerse melancólica",
    p_m_mismatch_ungram: "Los chicos lavaron a la chica antes de ponerse melancólica",
    s_f_match_ungram: "La chica lavó al chico antes de ponerse melancólico",
    p_f_mismatch_ungram: "Las chicas lavaron al chico antes de ponerse melancólico",
  },
  2: {
    s_m_match_gram: "El chico tocó a la chica antes de sentirse animado",
    s_m_mismatch_gram: "El chico tocó a las chicas antes de sentirse animado",
    s_f_match_gram: "La chica tocó al chico antes de sentirse animada",
    s_f_mismatch_gram: "La chica tocó a los chicos antes de sentirse animada",
    s_m_match_ungram: "El chico tocó a la chica antes de sentirse animada",
    p_m_mismatch_ungram: "Los chicos tocaron a la chica antes de sentirse animada",
    s_f_match_ungram: "La chica tocó al chico antes de sentirse animado",
    p_f_mismatch_ungram: "Las chicas tocaron al chico antes de sentirse animado",
  },

// Controls per participant: the poster describes 16 controls, 50/50 grammatical/ungrammatical,
// drawn at random from the 20 fillers (10 grammatical + 10 ungrammatical) of each language.
const N_CONTROLS_PER_PARTICIPANT = 16;

const SLIDER_TEXT = {
  es: {
    next: 'Siguiente',
    instructions:

function makeSliderBlock(L){
  const T = SLIDER_TEXT[L];

  // Latin square: item i gets condition (start + i) mod number-of-conditions, one random list per participant
  const list_number = jsPsych.randomization.randomInt(0, T.list_starts.length - 1);

  const practice_items = T.practice.map(function(p, i){
    return {sentence: p[0], condition: 'training', grammaticality: p[1], item: (i + 1) + '_training'};
  });

  // No plural sentences in this study: the 'mismatch' conditions (plural subject or object) are dropped.
  // Spanish: each list assigns one of 8 conditions to every one of the 32 items, so each participant sees the
  // 16 items that fall into the 4 singular ('match') conditions. English: 16 items x 4 conditions.
  // Either way: 16 test sentences, 4 per condition.
  const trial_items = [];
  for(let i = 1; i <= T.n_items; i++){
    const cond = T.cond_order[(T.list_starts[list_number] + i - 1) % T.cond_order.length];
    if(cond.indexOf('mismatch') !== -1){ continue; }
    trial_items.push({
      sentence: T.tests[i][cond],
      condition: cond,
      grammaticality: cond.endsWith('_ungram') ? 'No' : 'Yes',
      item: i + '_test'
    });
  }
  // controls: N_CONTROLS_PER_PARTICIPANT sentences, half grammatical and half ungrammatical, chosen at random
  const all_fillers = T.fillers.map(function(f, k){
    return {sentence: f[0], condition: 'filler', grammaticality: f[1] ? 'Yes' : 'No', item: (k + 1) + '_filler'};
  });
  const half = N_CONTROLS_PER_PARTICIPANT / 2;
  jsPsych.randomization.shuffle(all_fillers.filter(function(f){ return f.grammaticality === 'Yes'; })).slice(0, half).forEach(function(f){ trial_items.push(f); });
  jsPsych.randomization.shuffle(all_fillers.filter(function(f){ return f.grammaticality === 'No'; })).slice(0, half).forEach(function(f){ trial_items.push(f); });

  const instructions = {
    type: jsPsychInstructions,
    pages: ['<div class="directions" style="width:80%; margin:auto;" align="left">' + T.instructions + '</div>'],
    button_label_next: T.next,
    allow_backward: false,
    show_clickable_nav: true,
    on_start: setStyle('slider-task'),
    data: {trial_phase: 'slider_instructions'}
  };

  const instructions2 = {
    type: jsPsychHtmlButtonResponse,
    stimulus: T.start,
    choices: [T.next],
    on_start: requireLandscape,
    data: {trial_phase: 'slider_start'}
  };

  const sentence2 = {
    type: jsPsychHtmlSliderResponse,
    stimulus: function(){ return jsPsych.evaluateTimelineVariable('sentence') + '.'; },
    prompt: '<p style="margin:0.3em 0;">' + T.prompt + '</p>',
    labels: T.labels,
    // jsPsych draws each end label in a box as wide as the slider, centred on the slider's end,
    // so the slider must be at most ~half the screen width or the page overflows and phones zoom out.
    slider_width: function(){ return Math.max(160, Math.min(500, Math.floor(window.innerWidth * 0.45))); },
    require_movement: true,
    button_label: T.next,
    on_start: requireLandscape,
    post_trial_gap: 500,
    data: {
      trial_phase: 'slider_sentence',
      sentence: jsPsych.timelineVariable('sentence'),
      condition: jsPsych.timelineVariable('condition'),
      grammaticality: jsPsych.timelineVariable('grammaticality'),
      item: jsPsych.timelineVariable('item')
    },
    on_finish: advance
  };

  // Practice sentences: the answer must be on the right side of the midline (50).
  //   grammatical sentence ('Yes')   -> rating must not be below 50
  //   ungrammatical sentence ('No')  -> rating must not be above 50
  // If it is on the wrong side, the "next" click is blocked and a red message is shown
  // on the same screen; the participant can adjust the slider and try again.
  const practice_trial = function(item){
    return Object.assign({}, sentence2, {
      stimulus: item.sentence + '.',
      data: {trial_phase: 'slider_practice', sentence: item.sentence, condition: item.condition,
             grammaticality: item.grammaticality, item: item.item},
      on_load: function(){
        const container = jsPsych.getDisplayElement();
        const slider = container.querySelector('#jspsych-html-slider-response-response');
        const button = container.querySelector('#jspsych-html-slider-response-next');

        // red message, space reserved so the layout does not jump
        const msg = document.createElement('p');
        msg.textContent = T.sure;
        msg.setAttribute('role', 'alert');
        msg.style.cssText = 'color:red; font-weight:bold; visibility:hidden; margin:0.3em 0;';
        button.parentNode.insertBefore(msg, button);

        const is_wrong = function(){
          const v = Number(slider.value);
          return (item.grammaticality === 'Yes') ? (v < 50) : (v > 50);
        };
        // capture phase on the container: runs before the plugin's own click handler
        container.addEventListener('click', function(e){
          if(e.target === button && is_wrong()){
            e.stopPropagation();
            msg.style.visibility = 'visible';
          }
        }, true);
        slider.addEventListener('input', function(){ msg.style.visibility = 'hidden'; });
      }
    });
  };

  const practice1 = {
    timeline: practice_items.map(practice_trial),
    randomize_order: false
  };

  // Shuffle the test items and the fillers separately, then spread the fillers
  // evenly through the trials. All test items and all fillers are shown.
  const tests = jsPsych.randomization.shuffle(trial_items.filter(function(t){ return t.condition !== 'filler'; }));
  const fills = jsPsych.randomization.shuffle(trial_items.filter(function(t){ return t.condition === 'filler'; }));
  const n_all = tests.length + fills.length;
  const ordered_items = [];
  let ti = 0, fi = 0;
  for(let k = 0; k < n_all; k++){
    const filler_due = Math.floor((k + 1) * fills.length / n_all) > Math.floor(k * fills.length / n_all);
    ordered_items.push(filler_due ? fills[fi++] : tests[ti++]);
  }

  total_trials += practice_items.length + ordered_items.length;

  const procedure = {
    timeline: [sentence2],
    timeline_variables: ordered_items,
    randomize_order: false
  };

  return {timeline: [instructions, practice1, instructions2, procedure],
          data: {task: 'slider_' + L, sentence_language: L, slider_list: list_number + 1}};
}

let raffle_email = '';
const LEAVE_URL = "https://www.uned.es/universidad/inicio/en/";   // where participants go after finishing
function leave(){ window.location = LEAVE_URL; }

function saveRaffleEmailAndLeave(){
  if(!raffle_email){ leave(); return; }
  // A separate file with a random name (the answers are named with the timestamp), so the two cannot be matched.
  const cell = /^[=+\-@]/.test(raffle_email) ? "'" + raffle_email : raffle_email;   // never let a spreadsheet read it as a formula
  const x = new XMLHttpRequest();
  x.open('POST', 'write_data.php');
  x.setRequestHeader('Content-Type', 'application/json');
  x.onload = leave;
  x.onerror = leave;
  x.send(JSON.stringify({filename: 'raffle_email_' + jsPsych.randomization.randomID(12), filedata: 'email\n"' + cell.replace(/"/g, '""') + '"\n'}));
}

// The data are sent to the server and the participant is only sent on once the server has accepted them.
// If saving fails it is retried; after 3 failed attempts the participant can try again, download the
// answers, or continue anyway.
function saveData(name, data){
  let attempts = 0;
  const showMsg = function(html){ jsPsych.getDisplayElement().innerHTML = '<div class="consent-page" style="text-align:center">' + html + '</div>'; };
  const failed = function(){
    if(attempts < 3){ setTimeout(attempt, 1500 * attempts); return; }
    showMsg('<p>No se han podido guardar tus respuestas.</p><p>Comprueba tu conexión a internet e inténtalo de nuevo.</p>' +
      '<div><button class="jspsych-btn" id="retry-save">Intentarlo de nuevo</button> ' +
      '<button class="jspsych-btn" id="download-save">Descargar mis respuestas</button> ' +
      '<button class="jspsych-btn" id="continue-anyway">Continuar de todos modos</button></div>');
    document.getElementById('retry-save').onclick = function(){ attempts = 0; attempt(); };
    document.getElementById('continue-anyway').onclick = saveRaffleEmailAndLeave;
    document.getElementById('download-save').onclick = function(){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], {type: 'text/csv'}));
      a.download = name + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
    };
  };
  const attempt = function(){
    attempts++;
    showMsg('<p>Guardando tus respuestas... por favor, no cierres esta página.</p>');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'write_data.php');
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 20000;
    xhr.onload = function(){
      let ok = xhr.status >= 200 && xhr.status < 300;
      try { const j = JSON.parse(xhr.responseText); if(j && j.ok === false){ ok = false; } } catch(e) {}
      if(ok){ saveRaffleEmailAndLeave(); } else { failed(); }
    };
    xhr.onerror = failed;
    xhr.ontimeout = failed;
    xhr.send(JSON.stringify({filename: name, filedata: data}));
  };
  attempt();
}
